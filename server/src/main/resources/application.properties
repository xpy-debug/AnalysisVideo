server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Model gateway
ai.deepseek.api-key=${SILICONFLOW_API_KEY}
ai.deepseek.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${LLM_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
ai.deepseek.input-price-per-million=${LLM_INPUT_PRICE_PER_MILLION:0}
ai.deepseek.output-price-per-million=${LLM_OUTPUT_PRICE_PER_MILLION:0}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
# 0 means disabled. When enabled, configure both provider prices above.
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:0}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.api-key=${QDRANT_API_KEY:}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
# OCR：PaddleOCR 服务为主，进程内 Tesseract（Tess4J）仅作服务不可用时的回退
tool.ocr.url=${OCR_URL:http://localhost:8868/ocr}
tool.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:60}
# data-path 需指向存放 *.traineddata 的目录，且必须自备 chi_sim.traineddata
tool.ocr.data-path=${OCR_TESSDATA_PATH:./tessdata}
tool.ocr.languages=${OCR_LANGUAGES:chi_sim+eng}
tool.ocr.fallback-enabled=${OCR_FALLBACK_ENABLED:true}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:dovideo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# 重试耗尽后不再回队列，交给主队列绑定的死信交换机兜底，避免无退避空转
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=${MQ_PREFETCH:1}
# 消费内重试，次数与 VideoAnalysisConsumer.MAX_DELIVERY_ATTEMPTS(3) 对齐，退避 5s -> 10s -> 30s
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${MQ_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30000

# 消息队列拓扑
app.mq.video-analysis.exchange=${MQ_ANALYSIS_EXCHANGE:video-analysis.exchange}
app.mq.video-analysis.queue=${MQ_ANALYSIS_QUEUE:video-analysis.queue}
app.mq.video-analysis.routing-key=${MQ_ANALYSIS_ROUTING_KEY:video.analysis}
app.mq.video-analysis-dead.exchange=${MQ_ANALYSIS_DEAD_EXCHANGE:video-analysis.dead.exchange}
app.mq.video-analysis-dead.queue=${MQ_ANALYSIS_DEAD_QUEUE:video-analysis.dead.queue}
app.mq.video-analysis-dead.routing-key=${MQ_ANALYSIS_DEAD_ROUTING_KEY:video.analysis.dead}

# 音频分析链路(与视频链路独立的交换机/队列/死信)
app.mq.audio-analysis.exchange=${MQ_AUDIO_ANALYSIS_EXCHANGE:audio-analysis.exchange}
app.mq.audio-analysis.queue=${MQ_AUDIO_ANALYSIS_QUEUE:audio-analysis.queue}
app.mq.audio-analysis.routing-key=${MQ_AUDIO_ANALYSIS_ROUTING_KEY:audio.analysis}
app.mq.audio-analysis-dead.exchange=${MQ_AUDIO_ANALYSIS_DEAD_EXCHANGE:audio-analysis.dead.exchange}
app.mq.audio-analysis-dead.queue=${MQ_AUDIO_ANALYSIS_DEAD_QUEUE:audio-analysis.dead.queue}
app.mq.audio-analysis-dead.routing-key=${MQ_AUDIO_ANALYSIS_DEAD_ROUTING_KEY:audio.analysis.dead}
